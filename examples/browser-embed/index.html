<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sturna — browser embed example</title>
  <style>
    :root { --bg:#0a0e0a; --panel:#101710; --line:#1e2b1c; --ink:#d7e4cf; --dim:#71856a; --mint:#c4f03a; }
    * { box-sizing:border-box; margin:0; }
    body {
      background:var(--bg); color:var(--ink); min-height:100vh; padding:40px 20px;
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display:flex; justify-content:center;
    }
    .app { width:min(720px,100%); display:flex; flex-direction:column; gap:18px; }
    h1 { font-size:16px; letter-spacing:.3em; text-transform:uppercase; }
    h1 small { display:block; margin-top:6px; font-size:11px; letter-spacing:.08em; color:var(--dim); font-weight:400; }
    .metrics { display:flex; gap:28px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    .m .k { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
    .m .v { font-size:22px; font-variant-numeric:tabular-nums; }
    .v.pos { color:#7ee787; } .v.neg { color:#ff6b6b; }
    button {
      align-self:flex-start; font:inherit; font-size:13px; letter-spacing:.06em; cursor:pointer;
      color:var(--mint); background:#141c0b; border:1px solid #35401d; border-radius:8px; padding:10px 18px;
    }
    button:disabled { opacity:.5; cursor:default; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
    ul { list-style:none; font-size:12px; color:var(--dim); display:flex; flex-direction:column; gap:6px; }
    .agent { font-weight:700; }
    .panel { padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Sturna <small>the whole agent swarm, running in this tab</small></h1>

    <div class="metrics">
      <div class="m"><div class="k">NAV</div><div class="v" id="nav">-</div></div>
      <div class="m"><div class="k">Total return</div><div class="v" id="ret">-</div></div>
      <div class="m"><div class="k">Cycles</div><div class="v" id="cycles">0</div></div>
    </div>

    <button id="run" type="button">Run one cycle</button>

    <div class="panel">
      <table>
        <thead><tr><th>Ticker</th><th>Weight</th><th>Value</th><th>Conviction</th></tr></thead>
        <tbody id="positions"></tbody>
      </table>
    </div>

    <div class="panel">
      <ul id="activity"></ul>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
