name: 🐛 Bug report
description: Something in the swarm, API, or dashboard is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Ran `npm run cycle` and the Sentinel halted every cycle with…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent engine (src/core)
        - API server (src/server)
        - Dashboard (web)
        - Docs / other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm install
        2. npm run cycle
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, browser (for dashboard issues)
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell
