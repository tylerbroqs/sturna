name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine — typecheck & smoke cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run one full swarm cycle (paper mode)
        run: npm run cycle
