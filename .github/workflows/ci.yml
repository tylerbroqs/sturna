name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine — typecheck, tests & smoke cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Run one full swarm cycle (paper mode)
        run: npm run cycle
      - name: Backtest smoke (short, deterministic)
        run: npm run backtest -- --cycles 6 --steps 2
      - name: Library build (ESM + declarations)
        run: npm run build
      - name: Examples smoke
        run: npm run example:agent && npm run example:browser
